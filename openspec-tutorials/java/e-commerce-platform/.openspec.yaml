name: e-commerce-platform
version: 1.0.0
description: Full-featured e-commerce backend with payment integration
language: java
framework: spring-boot

metadata:
  difficulty: advanced
  estimated_time: 6-8 hours
  topics:
    - Spring Boot
    - PostgreSQL
    - Redis
    - Payment Gateway
    - E-Commerce
    - Shopping Cart
    - Order Management

structure:
  src:
    - controllers/
    - services/
    - repositories/
    - models/
    - security/
    - payment/
  docs:
    - proposal.md
    - README.md

dependencies:
  - java: ">=17"
  - maven: ">=3.6"
  - spring-boot: "3.2.0"
  - postgresql: ">=14"
  - redis: ">=7.0"

build:
  command: mvn clean install
  run: mvn spring-boot:run

learning_objectives:
  - Build complex e-commerce backend
  - Implement shopping cart functionality
  - Integrate payment gateway
  - Manage orders and inventory
  - Use Redis for caching
  - Handle transactions

# Made with Bob
